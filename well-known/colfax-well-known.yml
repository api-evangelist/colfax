domain_disposition:
  note: >-
    Material provenance finding. colfaxcorp.com survives as a mail and DNS
    shell, and it is administered by ESAB Corporation — the fabrication
    technology spin-off — not by Enovis, the entity that inherited the Colfax
    legal identity. Recorded because it corrects the naive assumption that the
    renamed entity kept the old domain.
  evidence:
    - record: SPF (TXT colfaxcorp.com)
      value: v=spf1 include:spf.protection.outlook.com a:analytics.colfaxcorp.com a:mail.esab.eu -all
    - record: DMARC (TXT _dmarc.colfaxcorp.com)
      value: v=DMARC1; p=none; rua=mailto:dmarcreport@esab.com; ruf=mailto:dmarcreport@esab.com; fo=1
    - record: MX
      value: colfaxcorp-com.mail.protection.outlook.com
    - record: A
      value: none published
    - record: CAA
      value: none published
    - record: DS (DNSSEC)
      value: none published
  checked: '2026-09-05'
